# ############################################################################
#  무기에 걸기
#
#  칸마다 skill(어느 스킬) 과 unlock(열리는 강화 단계)을 적습니다.
#  unlock 을 안 적으면 칸의 기본값(0 · 4 · 8 · 12)입니다.
#
#  **무기 이름과 스킬 이름은 한 낱말을 나눠 갖습니다.** "은잎 창" 을 들면
#  "은잎 관통" 이 나와야 합니다. 무기 이름은 CraftEngine 쪽에 있습니다 —
#  plugins/CraftEngine/resources/fox/configuration/items/w_series.yml
#
#  **아이디로 생김새를 짐작하지 마세요.** w11 은 번호와 색만 보면 지팡이
#  같지만 화염 대검이고, w3 은 오래 "단검" 으로 적혀 있었지만 도살검입니다.
#  scratchpad 의 render_items.py 로 그려서 봐야 압니다.
# ############################################################################

