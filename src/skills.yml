# ############################################################################
#  무기 스킬
#
#  무기 하나에 **넷까지** 걸립니다. 강화 단계가 오르면 하나씩 열립니다 —
#  그래야 강화가 "숫자가 조금 오른다" 가 아니라 **새로 할 수 있는 일이
#  생긴다** 가 됩니다.
#
#      우클릭              +0   무기를 얻자마자
#      웅크리기 + 우클릭    +4
#      좌클릭 (허공)       +8
#      웅크리기 + 좌클릭    +12  마지막 한 방
#
#  좌클릭은 **허공을 칠 때만** 봅니다. 블록을 치면 캐는 동작이고 몹을 치면
#  평타라 각각 다른 이벤트로 갑니다 — 겹치지 않습니다.
#
#  ────────────────────────────────────────────────────────────────────────
#  갈래 16종
#  ────────────────────────────────────────────────────────────────────────
#    참격      검기가 앞으로 날아간다
#    회전베기  세 바퀴 돌며 한 바퀴마다 벤다
#    돌진      잔상을 남기며 꿰뚫고 지나간다
#    도약      뛰어올랐다 내리찍는다 (고리가 퍼진다)
#    각성      잠깐 강해진다 (오라가 감싼다)
#    꿰뚫기    한 줄에 선 것을 다 꿰뚫는다
#    빙결      얼음이 터지며 얼려 붙인다
#    운석      하늘에서 불덩이가 떨어진다 (자리를 미리 알려 준다)
#    연쇄      번개가 적에서 적으로 튀어 옮겨 간다
#    소용돌이  끌어당기며 계속 벤다
#    균열      땅이 갈라지며 앞으로 나아간다
#    처형      다친 것일수록 크게 들어간다 (최대 3배)
#    수호      흡수 하트 + 저항
#    띄우기    띄워 올리고 연달아 벤다
#    연사      화살을 부채꼴로 쏟아낸다
#
#  power    피해 배수. 기준은 **그 사람의 공격력**입니다
#  cooldown 다시 쓰기까지 (초)
#  range    닿는 거리 (블록)
#  duration 각성·빙결처럼 이어지는 것의 시간 (초)
#  bleed    출혈 **한 겹이 1초에 넣는 피해**. 여기만 **배수가 아니라 그냥
#           숫자**입니다 — 공격력을 안 봅니다.
#
#           왜 다른가. 출혈은 작은 값을 자주 넣는데, 그 값이 피해 계산을
#           다시 타면서 공격력이 통째로 얹혔습니다. 평타가 21 이면 출혈
#           한 틱도 21 이 되어 "지속 피해" 가 아니라 "평타 연타" 였습니다.
#           지금은 적은 값이 그대로 들어갑니다 (방어구도 안 깎습니다).
#
#  고친 뒤 /prowess 리로드
# ############################################################################

