# ############################################################################
#  Prowess — 능력치 · 강화 · 장신구 · 무기 스킬
#
#  이 플러그인의 시작점은 하나입니다. **바닐라 방어를 버립니다.**
#
#  마인크래프트는 방어구 20점에서 감소가 80% 로 잘리고, 그 위로는 아무리 좋은
#  방어구를 입어도 달라지는 게 없습니다. 강화도 장신구도 얹을 자리가 없다는
#  뜻입니다. 그래서 피해 계산을 우리가 다시 합니다.
#
#      감소율 = 방어 / (방어 + defense-k)
#
#  상한이 없고 100% 에도 절대 닿지 않습니다. 늘어나는 폭이 줄어들 뿐입니다.
#  실질 체력은 방어에 **정비례**합니다 (1 + 방어/K 배) — "방어를 100 더 올리면
#  얼마나 튼튼해지는가" 가 어디서나 같습니다.
#
#  값은 아무 데도 저장하지 않습니다. 장비 능력치와 강화 단계는 **아이템에**,
#  장신구는 **플레이어에** 새깁니다. 이 플러그인을 빼도 물건은 그대로입니다.
#
#  고친 뒤 /prowess 리로드
# ############################################################################

# 이 숫자가 올라가면 서버 파일을 백업하고 새 것으로 바꿉니다.
# 고친 내용은 _backup/ 에 남습니다.
config-version: 5

combat:
  # 감소 공식의 완만함. 클수록 같은 방어의 값어치가 줄어듭니다.
  #
  #   방어  50 → -33%  (맷집 1.5배)
  #   방어 100 → -50%  (맷집 2.0배)
  #   방어 300 → -75%  (맷집 4.0배)
  #   방어 900 → -90%  (맷집 10배)
  defense-k: 100
  
  # 바닐라 방어구 점수를 우리 방어로 환산하는 값.
  #
  # 피해 계산에서 바닐라 감소를 통째로 끄기 때문에, 환산하지 않으면 네더라이트
  # 한 벌이 아무 쓸모가 없어집니다. 네더라이트 풀세트가 방어구 20점이므로
  # 4 를 곱하면 방어 80 (약 -44%) 에서 출발합니다.
  defense-per-armor-point: 4
  defense-per-toughness: 6
  
  # 몹은 우리 능력치를 안 갖고 있습니다. 몹의 바닐라 방어구 점수로 환산합니다.
  mob-defense-per-armor: 3
  
  # 허수아비로 칠 MythicMobs 몹 이름.
  #
  # 여기 적힌 몹은 **안 죽습니다.** 대신 피해는 그대로 다 들어가고 액션바에
  # 뜹니다 — 딜을 재 보려고 세워 둔 물건이라 죽으면 곤란하고, 그렇다고
  # 무적으로 만들면 숫자가 안 뜹니다. 그래서 맞기는 다 맞히고 깎인 체력만
  # 도로 채웁니다. 머리 위에는 쌓인 피해와 초당 피해가 뜹니다.
  #
  # MythicMobs 가 없거나 못 물어보면 이름에 '허수아비' 가 든 몹으로 갈음합니다.
  dummy-mobs:
  - Target_Dummy
  
  # 사람끼리 싸울 때 피해 배수. 1.0 이면 몹을 때리는 것과 같습니다.
  #
  # 0.5 로 둔 이유: 강화 차이가 그대로 한 방이 되면 늦게 들어온 사람이
  # 아무것도 못 합니다. 절반이면 차이는 나되 반격할 틈이 생깁니다.
  pvp-factor: 0.5

# ---------------------------------------------------------------------------
#  직업 특전 — Mastery 의 레벨 1당 붙는 능력치
#
#  광부 50레벨이고 아래 표에 방어 1 이면 방어 +50 입니다.
#  Mastery 가 없으면 이 몫이 통째로 0 이 되고 나머지는 그대로 돕니다.
#
#  이 서버의 직업은 싸움 직업이 아닙니다(농부·어부·광부·요리사). 그래서
#  전투력을 크게 주지 않고 **버티는 쪽**으로 조금씩만 얹었습니다 — 농사만
#  하던 사람도 몹을 만났을 때 한 번은 견디게 하려는 정도입니다.
# ---------------------------------------------------------------------------
jobs:
  농부:
    stats:
      최대 체력: 0.2 # 100레벨이면 하트 10칸
      방어: 0.5
  어부:
    stats:
      최대 체력: 0.1
      이동 속도: 0.05 # 100레벨이면 +5%
      치명타 확률: 0.1
  광부:
    stats:
      방어: 1.0 # 100레벨이면 방어 +100 (맷집 2배)
      최대 체력: 0.1
  요리사:
    stats:
      최대 체력: 0.3 # 100레벨이면 하트 15칸
      흡혈: 0.05 # 100레벨이면 준 피해의 5% 회복

# ---------------------------------------------------------------------------
#  칭호 특전 — 그 칭호를 달고 있는 동안 받는 능력치
#
#  칭호가 **이름표에 그치지 않고 힘이 되게** 하려는 것입니다.
#  칭호 자체는 Epithet 이 만들고(/칭호), 여기서는 그 칭호가 무엇을 주는지만
#  정합니다 — 만드는 곳과 값을 매기는 곳을 나눠 두면 어느 쪽을 고쳐도
#  서로 안 깨집니다.
#
#  **손으로 안 적어도 됩니다.** `/prowess 칭호` 창에서 누르면 여기에 저절로
#  적힙니다. 아래는 어떻게 생겼는지 보여 주는 본보기입니다.
#
#  키는 Epithet 의 칭호 아이디입니다 (titles.yml 의 키).
# ---------------------------------------------------------------------------
titles:
  administrator:
    stats:
      방어: 520.0
      최대 체력: 200.0

# ############################################################################
#  파티 — 같이 다니는 사람들
# ############################################################################
#
#  하는 일은 셋입니다. 서로 안 때리게 하고, 화면 오른쪽에 서로를 띄우고,
#  몇 명까지 묶일지 정합니다.
#
#  **저장하지 않습니다.** 파티는 그때그때 모이는 것이라 서버를 껐다 켜면
#  흩어집니다. 저장하면 몇 달 전에 한 번 같이 사냥한 파티가 그대로 남아,
#  새로 짜려는 사람이 먼저 나가기부터 해야 합니다.
#
#  명령: /파티 초대 <사람> · 수락 · 거절 · 나가기 · 추방
party:
  # 파티에 묶일 수 있는 사람 수 (파티장 포함). 최소 2.
  max-size: 3

  # 파티끼리 서로 때릴 수 있게 할지.
  #
  # false 면 **피해를 통째로 취소합니다.** 0 으로 눌러 두면 맞는 시늉
  # (무적 시간·넉백·붉은 깜빡임)이 그대로 남아, 같이 싸우다 서로를
  # 밀치게 됩니다.
  friendly-fire: false
