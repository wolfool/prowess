name: Prowess
version: '1.0.3'
main: com.wolfool.prowess.ProwessPlugin
api-version: '1.21'
author: wolfool
description: 능력치 · 강화 · 장신구 · 무기 스킬. 바닐라 방어의 상한을 버리고 다시 계산합니다

# 전부 없어도 돕니다.
#   Vault        강화 비용 (없으면 값을 안 받습니다)
#   Mastery      직업 특전 (없으면 그 몫만 0)
#   CraftEngine  무기 아이디 판별 (없으면 재질로만 봅니다)
softdepend:
  - Vault
  - PlaceholderAPI
  - Mastery
  - CraftEngine

commands:
  prowess:
    description: Prowess 관리
    usage: /<command> [진단|스킬|새기기|리로드]
    aliases: [기량]
  party:
    description: 같이 다니는 사람들
    usage: /파티 [초대|수락|거절|나가기|추방]
    aliases: [파티, 팟]
  stats:
    description: 지금 내 능력치
    usage: /스탯
    aliases: [스탯, 능력치]
  enhance:
    description: 장비를 강화합니다
    usage: /강화
    aliases: [강화]
  accessory:
    description: 반지 · 목걸이 · 귀걸이
    usage: /장신구
    aliases: [장신구]

permissions:
  prowess.skill:
    description: 무기 스킬을 쓸 수 있습니다
    default: true
  prowess.admin:
    description: 설정을 다시 읽고 능력치를 새길 수 있습니다
    default: op
